services:
  - type: web
    name: sprintdeutsch-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini          # change to "claude" if you prefer Anthropic
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Retrieval embeddings come from the Gemini API (see GEMINI_EMBEDDING_MODEL);
      # EMBEDDING_MODEL is only the legacy local-transformer name kept for /health.
      - key: EMBEDDING_MODEL
        value: paraphrase-multilingual-MiniLM-L12-v2
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMS
        value: "768"
      # Gemini 2.5 charges "thinking" tokens against max_output_tokens; the old
      # 800 budget got eaten by reasoning and answers were cut off mid-sentence.
      # rag.py now disables thinking, and this raises the visible-answer budget.
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: CLAUDE_MAX_TOKENS
        value: "2048"
      - key: TOP_K
        value: "6"
      - key: MIN_SIMILARITY
        value: "0.25"
      - key: CHROMA_DIR
        value: ./chroma_db
      # The vector index is built offline by `backend/rebuild_library.py` and
      # committed in chroma_db/, so the server never rebuilds it at startup.
      # NOTE: if this service predates render.yaml, Render ignores this block —
      # PREBUILT_INDEX must then be set in the dashboard by hand. Check
      # /health: a "semantic index build failed: 429" note means the server is
      # still trying to embed at startup and retrieval is on BM25 keyword search.
      - key: PREBUILT_INDEX
        value: "1"
      # Set these as secret env vars in the Render dashboard (do NOT put real keys here):
      # GEMINI_API_KEY
      # ANTHROPIC_API_KEY
