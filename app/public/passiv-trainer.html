<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passive Voice</title>
<style>
/* SprintDeutsch theme — same tokens as the other Special-topics trainers */
:root{
  --bg:#d4e8c2; --bg2:#e8f3de; --surface:#ffffff; --surface2:#f6faf2;
  --line:#b8d99e; --line-soft:#dcecca; --ink:#1e293b; --head:#284a18;
  --muted:#5c6b5a; --accent:#427726; --nav:#355f1f; --cream:#f9e96a;
  --ok:#42802a; --ok-bg:#eaf5df; --bad:#c0392b; --bad-bg:#fdecea;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;font-style:normal !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header card */
.hero{background:var(--nav);color:#fff;border-radius:20px;padding:22px 20px 20px;
  box-shadow:0 6px 18px rgba(40,74,24,.25)}
.hero-top{display:flex;gap:12px;align-items:center}
.hero svg.ico{flex:none}
.hero h1{margin:0;font-size:1.55rem;line-height:1.15;font-weight:700;letter-spacing:-.01em;color:#fff}
.hero p{margin:10px 0 16px;color:#dcecca;font-size:1rem}
.btn-new{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--head);
  border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:1rem;
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .12s}
.btn-new:hover{transform:translateY(-1px)}

/* progress card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.prog{margin-top:14px;padding:14px 16px}
.prog-row{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);font-weight:500}
.prog-row b{color:var(--head)}
.bar{height:8px;background:var(--line-soft);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* task card */
.task{margin-top:14px;overflow:hidden}
.task-head{background:var(--bg2);padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}
.lbl{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.sentence{margin:8px 0 0;font-size:1.4rem;line-height:1.3;font-weight:700;color:var(--ink)}
.meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:600;color:var(--head)}
.fields{padding:6px 18px 8px}
.field{margin-top:14px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field label{font-weight:700;color:#334155}
.hint{font-size:.76rem;color:var(--muted)}
.field textarea{display:block;width:100%;margin-top:6px;padding:13px 14px;font:inherit;font-size:16px;line-height:1.4;color:var(--ink);
  background:#fff;border:2px solid var(--line-soft);border-radius:12px;resize:none;overflow:hidden}
.field textarea::placeholder{color:#94a3b8}
.field textarea:focus{border-color:var(--accent);outline:none}
.field.ok textarea{border-color:var(--ok);background:var(--ok-bg)}
.field.bad textarea{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:6px;font-size:.9rem;line-height:1.4}
.fb .v{font-weight:800}
.field.ok .fb .v{color:var(--ok)}
.field.bad .fb .v{color:var(--bad)}
.fb .model{display:block;margin-top:2px;color:var(--ink)}
.fb .tip{display:block;margin-top:2px;color:var(--muted)}
.note{margin:16px 18px 0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line-soft);
  border-radius:10px;font-size:.88rem;color:#334155}
.note b{color:var(--head)}
.foot{padding:16px 18px 18px;margin-top:16px;border-top:1px solid var(--line-soft);display:flex;
  justify-content:space-between;align-items:center;gap:12px}
.score{font-weight:700;color:var(--head)}
.btn-main{background:var(--nav);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:700;
  font-size:1rem;margin-left:auto;box-shadow:0 2px 6px rgba(40,74,24,.3)}
.btn-main:hover{background:#2c4f19}

/* results */
.res{margin-top:14px;padding:20px 18px}
.res h2{margin:0 0 4px;font-size:1.25rem;color:var(--head)}
.res .big{font-size:2rem;font-weight:800;color:var(--head)}
.res ul{list-style:none;margin:14px 0 18px;padding:0}
.res li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:.95rem}
.res li .mk{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:800;color:#fff}
.res li .mk.ok{background:var(--ok)} .res li .mk.bad{background:var(--bad)}
.res li small{display:block;color:var(--muted)}
@media(max-width:640px){.wrap{padding:12px 12px 48px}.hero h1{font-size:1.4rem}.sentence{font-size:1.28rem}}

/* extra buttons */
button{min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-ghost{width:100%;margin-top:10px;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);border-radius:999px;
  padding:10px 18px;font-weight:700;font-size:1rem}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.btn-alt{background:#fff;color:var(--head);border:2px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem}
.btn-alt:hover{background:var(--bg2)}
.btn-link{background:none;border:0;color:var(--bad);text-decoration:underline;font-size:.92rem;padding:10px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn-main{margin-left:0}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:stretch}
.btn-stack .btn-main{margin-left:0}
.warn{margin-top:10px;padding:8px 10px;background:var(--bad-bg);border:1px solid #f1b9b2;border-radius:8px;font-size:.84rem;color:var(--bad)}
.foot .btn-main{flex:none}
/* word families */
.fam{margin:0 18px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.fam>summary{cursor:pointer;padding:12px 14px;font-weight:800;color:var(--head);list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px;align-items:center}
.fam>summary::-webkit-details-marker{display:none}
.fam>summary span{font-weight:500;font-size:.82rem;color:var(--muted)}
.fam>summary::after{content:"+";font-weight:800;color:var(--accent);margin-left:auto;padding-left:8px}
.fam[open]>summary::after{content:"–"}
.fam-sec{padding:4px 14px 12px;border-top:1px solid var(--line-soft)}
.fam-title{margin-top:10px;font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.fam-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:6px}
.fam-head b{font-size:1.08rem;color:var(--ink)}
.fam-pl{font-size:.84rem;color:var(--muted)}
.fam-en{font-size:.88rem;color:var(--muted)}
.fam-forms{margin-top:4px;font-size:.92rem;color:#334155}
.fam-noun{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-soft)}
.fam-noun:first-of-type{border-top:0;padding-top:0}
.fam-r{margin-top:8px}
.fam-k{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:3px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.fi{background:#fff;border:1px solid var(--line-soft);border-radius:8px;padding:2px 8px;font-size:.86rem;line-height:1.45;color:var(--ink)}
/* my progress & mistakes */
.st{margin-top:14px;padding:20px 18px}
.st h2{margin:0 0 10px;font-size:1.25rem;color:var(--head)}
.st h3{margin:22px 0 8px;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--surface2);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px}
.kpis b{display:block;font-size:1.5rem;color:var(--head);line-height:1.2}
.kpis span{font-size:.82rem;color:var(--muted)}
.st-row{display:grid;grid-template-columns:128px 1fr 44px;gap:10px;align-items:center;margin-top:8px;font-size:.92rem;white-space:nowrap}
.st-row .bar{margin-top:0}.st-row b{text-align:right;color:var(--head)}
.er{margin-top:14px}
.er-top{display:flex;justify-content:space-between;gap:10px;font-size:.98rem}
.er-top span{font-weight:800;color:var(--bad)}
.bar-bad i{background:var(--bad)}
.er-rule{margin-top:6px;font-size:.88rem;color:#334155}
.er-ex{margin-top:6px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:8px;font-size:.86rem;color:var(--ink);word-break:break-word}
.er-ex span{font-weight:700;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.ml{list-style:none;margin:0;padding:0}
.ml li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:.94rem}
.ml .cnt{flex:none;min-width:34px;font-weight:800;color:var(--bad)}
.ml small{display:block;color:var(--muted)}
/* computer: wider layout, two columns of answer fields */
@media(min-width:900px){
  .wrap{max-width:840px;padding:28px 24px 72px}
  .hero{padding:26px 28px 24px}
  .sentence{font-size:1.6rem}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:6px 24px 8px}
  .task-head{padding:22px 24px 20px}
  .foot{padding:16px 24px 18px}.note{margin:16px 24px 0}.fam{margin:0 24px 24px}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:420px){.st-row{grid-template-columns:118px 1fr 40px;font-size:.88rem;gap:8px}.foot{flex-wrap:wrap}.foot .btn-main{width:100%}}
@supports(padding:max(0px)){.wrap{padding-bottom:max(56px,env(safe-area-inset-bottom))}}
</style>
</head>

</div>

function drawSet(weak){
  const lastSet=new Set(S.last||[]);
  const info=ITEMS.map(it=>{
    const st=S.stats[it.i],seen=!!(st&&st.s>0);
    return {id:it.i,seen:seen,missed:seen&&(st.b||0)===0&&st.f>0,f:seen?st.f:0,b:seen?(st.b||0):0};
  });
  let picked=[];
  if(weak){
    picked=info.filter(x=>x.f>0&&x.b<3).sort((a,b)=>(b.f-a.f)||(Math.random()-.5)).slice(0,SET_SIZE).map(x=>x.id);
  }
  // never the same list again: sentences of the previous set are left out, except ones you missed
  const pool=info.filter(x=>!picked.includes(x.id)&&(!lastSet.has(x.id)||x.missed)).map(x=>{
    const base=x.seen?PRIO[Math.min(5,x.b)]:1.0;
    return {id:x.id,missed:x.missed,k:base+Math.random()*1.8};
  }).sort((a,b)=>a.k-b.k);
  let missedN=picked.length;
  for(const c of pool){
    if(picked.length>=SET_SIZE)break;
    if(c.missed&&!weak){if(missedN>=2)continue;missedN++;}
    picked.push(c.id);
  }
  for(let i=picked.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picked[i],picked[j]]=[picked[j],picked[i]];}
  return picked;
}

/* ---------- answer checking ---------- */
function norm(t,keepCase){
  t=String(t).replace(/[‘’“”„‚"'`´]/g,'').replace(/[()]/g,'')
    .replace(/[.,;:!?]/g,' ').replace(/\s+/g,' ').trim();
  if(!keepCase)t=t.toLowerCase();
  t=t.replace(/(\d) (?=\d)/g,'$1');
  t=t.replace(/(^| )von dem( |$)/gi,'$1vom$2').replace(/(^| )bei dem( |$)/gi,'$1beim$2')
     .replace(/(^| )in dem( |$)/gi,'$1im$2').replace(/(^| )an dem( |$)/gi,'$1am$2')
     .replace(/(^| )zu dem( |$)/gi,'$1zum$2').replace(/(^| )zu der( |$)/gi,'$1zur$2');
  return t.replace(/\s+/g,' ');
}
const AUXSET=new Set(['werde','wirst','wird','werden','werdet','wurde','wurdest','wurden','wurdet',
  'bin','bist','ist','sind','seid','war','warst','waren','wart']);
function isAux(w){return AUXSET.has(w);}
function isAuxIn(s){return s.split(' ').some(isAux);}
function judge(user,model){
  const u=norm(user),m=norm(model);
  if(!u)return {r:'empty'};
  if(u===m){return {r:norm(user,true)===norm(model,true)?'ok':'case'};}
  const ut=u.split(' '),mt=m.split(' ');
  if(ut.length===mt.length && [...ut].sort().join(' ')===[...mt].sort().join(' ')){
    const tailLen=m.endsWith(' worden')?2:1;
    if(ut.slice(-tailLen).join(' ')===mt.slice(-tailLen).join(' ')){
      const auxI=ut.findIndex((w,i)=>i<ut.length-tailLen && mt.includes(w) && isAux(w));
      if(auxI>0){
        const first=ut.slice(0,auxI).join(' ');
        if((' '+m+' ').includes(' '+first+' ') && !isAuxIn(first))return {r:'alt'};
      }
    }
  }
  return {r:'bad'};
}
function tenseOf(w){for(const k in AUX){if(Object.values(AUX[k]).includes(w))return k;}return null;}

/* what exactly went wrong? -> {c: error type, tip: English hint} */
function diagnose(user,model,key,p){
  const u=norm(user),m=norm(model);
  if(!u)return {c:'empty',tip:''};
  const ut=u.split(' '),perfLike=(key==='perf'||key==='plus'),exp=AUX[key][p];
  if(ut.includes('geworden'))return {c:'geworden',tip:'Passive perfect uses worden, never geworden.'};
  if(perfLike&&!ut.includes('worden'))return {c:'noworden',tip:'Perfekt and Plusquamperfekt need worden after the Partizip II.'};
  if(!perfLike&&ut.includes('worden'))return {c:'extraworden',tip:'Präsens and Präteritum have no worden: werden + Partizip II only.'};
  if(perfLike&&ut.some(w=>HABEN.includes(w)))return {c:'haben',tip:'The passive perfect is built with sein, not haben.'};
  if(!ut.includes(exp)){
    const alt=ut.find(isAux);
    if(!alt)return {c:'noaux',tip:'The auxiliary “'+exp+'” is missing.'};
    return tenseOf(alt)===key
      ?{c:'agree',tip:'The auxiliary must agree with the subject: this subject needs “'+exp+'”.'}
      :{c:'tense',tip:'Wrong tense of the auxiliary: here you need “'+exp+'”.'};
  }
  const ptc=m.split(' ').filter(w=>w!=='worden').pop();
  if(!ut.includes(ptc))return {c:'participle',tip:'Check the Partizip II: “'+ptc+'”.'};
  if(!ut.some(w=>w==='von'||w==='vom'||w==='durch')&&/(^| )(von|vom|durch)( |$)/.test(m))
    return {c:'agent',tip:'The agent (von / durch …) is part of the sentence.'};
  if([...ut].sort().join(' ')===m.split(' ').sort().join(' '))
    return {c:'order',tip:'Same words, wrong order: the finite verb stands in position II, the Partizip II (+ worden) at the end.'};
  return {c:'other',tip:'Check word order and endings.'};
}

  ni.forEach(k=>{
    const n=NOUNS[k];
    h+='<div class="fam-noun"><div class="fam-head"><b>'+esc(n[0])+'</b>'+(n[1]&&n[1]!=='–'?'<span class="fam-pl">pl. '+esc(n[1])+'</span>':'<span class="fam-pl">no plural</span>')+
      '<span class="fam-en">'+esc(n[2])+'</span></div>'+rows([['Word family',n[3]]])+'</div>';
  });
  return '<details class="fam" open><summary>Word families <span>main verb and nouns</span></summary>'+h+'</details>';
}

/* ---------- render ---------- */
function renderProg(){
  if(!ses||view!=='practice'){$('#prog').innerHTML='';$('#prog').hidden=true;return;}
  $('#prog').hidden=false;
  const cur=ses.pos>=SET_SIZE?SET_SIZE:ses.pos+1;
  $('#prog').innerHTML='<div class="prog-row"><span>Progress</span><b>'+cur+' / '+SET_SIZE+'</b></div>'+
    '<div class="bar"><i style="width:'+(ses.pos>=SET_SIZE?100:(cur/SET_SIZE*100))+'%"></i></div>'+
    (memOK?'':'<div class="warn">Your browser blocks saving (private mode?). Progress and mistakes will be lost when you close this page.</div>');
}
function render(){
  if(view==='stats'){renderStats();return;}
  if(!ses){newSet();return;}
  renderProg();
  if(ses.pos>=SET_SIZE){renderResults();return;}
  const it=ITEMS[ses.ids[ses.pos]];
  const f=TENSES.map(([name,key])=>
    '<div class="field" data-k="'+key+'"><div class="field-top"><label for="f_'+key+'">'+name+'</label>'+
    '<span class="hint">'+AUX[key][it.p]+' + Partizip II'+((key==='perf'||key==='plus')?' + worden':'')+'</span></div>'+
    '<textarea id="f_'+key+'" rows="1" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="next" placeholder="Convert to '+name+'..."></textarea>'+
    '<div class="fb" hidden></div></div>').join('');
  $('#app').innerHTML=
   '<div class="card task"><div class="task-head"><div class="lbl">Active voice task</div>'+
   '<p class="sentence">'+esc(it.a)+'</p>'+
   '<div class="meta"><span class="chip">'+DOMAIN[it.d]+'</span><span>'+esc(it.s)+'</span></div></div>'+
   '<div class="fields">'+f+'</div><div id="note"></div>'+
   '<div class="foot"><span class="score" id="score" role="status"></span><button class="btn-main" id="btnCheck" type="button">Check Answers</button></div>'+
   '<div id="fam"></div></div>';
  checked=false;
  const inputs=[...document.querySelectorAll('.field textarea')];
  inputs.forEach((inp,i)=>{inp.addEventListener('input',()=>grow(inp));inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();
      if(checked){next();}
      else if(i<inputs.length-1){inputs[i+1].focus();}
      else{check();}}
  });});
  $('#btnCheck').addEventListener('click',()=>checked?next():check());
}
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';}

function check(){
  const it=ITEMS[ses.ids[ses.pos]];
  const vals=TENSES.map(([n,k])=>$('#f_'+k).value);
  if(vals.every(v=>!v.trim())){$('#f_pres').focus();return;}
  let good=0;const ok=[];
  TENSES.forEach(([name,key],idx)=>{
    const model=it.r[idx],j=judge(vals[idx],model);
    const field=document.querySelector('.field[data-k="'+key+'"]'),fb=field.querySelector('.fb');
    field.querySelector('textarea').disabled=true;
    const right=(j.r==='ok'||j.r==='case'||j.r==='alt');
    if(right)good++;ok.push(right);
    field.classList.add(right?'ok':'bad');
    S.tn[key].t++;if(right)S.tn[key].c++;
    let h='',code=null;
    if(j.r==='ok')h='<span class="v">Correct</span>';
    else if(j.r==='case'){code='case';h='<span class="v">Correct</span> — watch the capital letters: <span class="model">'+esc(model)+'</span>';}
    else if(j.r==='alt')h='<span class="v">Correct</span> — another valid word order. Model: <span class="model">'+esc(model)+'</span>';
    else{
      const d=diagnose(vals[idx],model,key,it.p);code=d.c;
      h='<span class="v">'+(j.r==='empty'?'Not answered':'Not quite')+'</span><span class="model">'+esc(model)+'</span>';
      if(d.tip)h+='<span class="tip">'+esc(d.tip)+'</span>';
    }
    if(code){ // remember the mistake type
      S.err[code]=(S.err[code]||0)+1;
      const ex=S.ex[code]||(S.ex[code]=[]);
      ex.unshift({i:it.i,t:key,u:vals[idx].trim().slice(0,160),m:model});
      if(ex.length>3)ex.length=3;
    }
    fb.innerHTML=h;fb.hidden=false;grow(field.querySelector('textarea'));
  });
  const st=S.stats[it.i]||{s:0,c:0,f:0,b:0};
  st.s++;if(good===4){st.c++;st.b=Math.min(5,(st.b||0)+1);}else{st.f++;st.b=0;}
  S.stats[it.i]=st;S.tot.checks=(S.tot.checks||0)+1;
  ses.res[ses.pos]={g:good,ok:ok};
  save();
  checked=true;
  $('#score').textContent=good+' / 4 correct';
  if(it.n)$('#note').innerHTML='<div class="note"><b>Note.</b> '+esc(it.n)+'</div>';
  $('#fam').innerHTML=famHTML(it);
  const b=$('#btnCheck');b.textContent=(ses.pos>=SET_SIZE-1)?'See results':'Next sentence';
  b.focus({preventScroll:true});
}
function next(){
  ses.pos++;checked=false;render();
  window.scrollTo(0,0);try{parent.scrollTo(0,0);}catch(e){}
}

function renderResults(){
  const full=ses.res.filter(r=>r&&r.g===4).length;
  const forms=ses.res.reduce((a,r)=>a+(r?r.g:0),0);
  const mastered=Object.values(S.stats).filter(x=>(x.b||0)>=3).length;
  const rowsH=ses.ids.map((id,i)=>{
    const r=ses.res[i]||{g:0};
    return '<li><span class="mk '+(r.g===4?'ok':'bad')+'">'+(r.g===4?'✓':'!')+'</span><div>'+esc(ITEMS[id].a)+
      '<small>'+r.g+' / 4 forms correct</small></div></li>';
  }).join('');
  $('#app').innerHTML='<div class="card res"><h2>Set complete</h2><div class="big">'+full+' / '+SET_SIZE+'</div>'+
    '<div class="hint">sentences with all four forms right · '+forms+' / '+(SET_SIZE*4)+' forms</div>'+
    '<ul>'+rowsH+'</ul>'+
    '<div class="hint" style="margin-bottom:14px">Missed sentences come back in later sets, mixed with new ones. Mastered so far: '+mastered+' / '+TOTAL+'.</div>'+
    '<div class="btn-row"><button class="btn-main" id="btnAgain" type="button">New Smart Set</button>'+
    '<button class="btn-alt" id="btnSt" type="button">My progress &amp; mistakes</button></div></div>';
  $('#btnAgain').addEventListener('click',()=>newSet());
  $('#btnSt').addEventListener('click',showStats);
}

/* ---------- my progress & mistakes ---------- */
let confirmReset=false;
function showStats(){view='stats';confirmReset=false;render();window.scrollTo(0,0);try{parent.scrollTo(0,0);}catch(e){}}
function back(){view='practice';render();window.scrollTo(0,0);try{parent.scrollTo(0,0);}catch(e){}}
function pct(c,t){return t?Math.round(c/t*100):0;}
function renderStats(){
  $('#prog').hidden=true;$('#prog').innerHTML='';
  const sts=Object.entries(S.stats);
  const practised=sts.filter(([k,x])=>x.s>0).length;
  const mastered=sts.filter(([k,x])=>(x.b||0)>=3).length;
  const weakN=sts.filter(([k,x])=>x.f>0&&(x.b||0)<3).length;
  const tt=Object.values(S.tn).reduce((a,x)=>a+x.t,0),tc=Object.values(S.tn).reduce((a,x)=>a+x.c,0);
  let h='<div class="card st"><h2>My progress</h2>'+
    '<div class="kpis"><div><b>'+practised+'</b><span>of '+TOTAL+' sentences practised</span></div>'+
    '<div><b>'+mastered+'</b><span>mastered</span></div>'+
    '<div><b>'+(tt?pct(tc,tt)+'%':'–')+'</b><span>forms correct</span></div>'+
    '<div><b>'+(S.tot.sets||0)+'</b><span>sets started</span></div></div>';
  if(!tt){
    h+='<p class="hint">Nothing recorded yet. Check a few sentences and your progress and typical mistakes will appear here.</p></div>';
  }else{
    h+='<h3>Accuracy by tense</h3>'+TENSES.map(([n,k])=>{
      const x=S.tn[k],p=pct(x.c,x.t);
      return '<div class="st-row"><span>'+n+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b>'+(x.t?p+'%':'–')+'</b></div>';
    }).join('');
    const errs=Object.entries(S.err).filter(([c])=>c!=='case').sort((a,b)=>b[1]-a[1]);
    const minor=S.err.case||0;
    h+='<h3>My most common mistakes</h3>';
    if(!errs.length)h+='<p class="hint">No mistakes recorded so far.</p>';
    const mx=errs.length?errs[0][1]:1;
    errs.slice(0,8).forEach(([c,n])=>{
      const e=ERR[c]||[c,''],ex=(S.ex[c]||[])[0];
      h+='<div class="er"><div class="er-top"><b>'+esc(e[0])+'</b><span>'+n+'×</span></div>'+
        '<div class="bar bar-bad"><i style="width:'+Math.max(6,Math.round(n/mx*100))+'%"></i></div>'+
        '<div class="er-rule">'+esc(e[1])+'</div>'+
        (ex?'<div class="er-ex"><span>You wrote</span> '+(ex.u?esc(ex.u):'(blank)')+'<br><span>Model</span> '+esc(ex.m)+'</div>':'')+'</div>';
    });
    if(minor)h+='<p class="hint">Minor: capital letters slipped '+minor+' time'+(minor>1?'s':'')+' (answers still counted as correct).</p>';
    const miss=sts.filter(([k,x])=>x.f>0).sort((a,b)=>(b[1].f-a[1].f)||(a[1].b-b[1].b)).slice(0,6);
    h+='<h3>Most-missed sentences</h3>';
    if(!miss.length)h+='<p class="hint">None yet.</p>';
    else h+='<ul class="ml">'+miss.map(([k,x])=>'<li><span class="cnt">'+x.f+'×</span><div>'+esc(ITEMS[k].a)+'<small>'+x.c+' of '+x.s+' attempts fully correct</small></div></li>').join('')+'</ul>';
    h+='</div>';
  }
  h+='<div class="btn-stack">'+
    (weakN?'<button class="btn-main" id="btnWeak" type="button">Practise my weak spots ('+Math.min(weakN,SET_SIZE)+' now)</button>':'')+
    '<button class="btn-alt" id="btnBack" type="button">Back to practice</button>'+
    (tt?'<button class="btn-link" id="btnReset" type="button">'+(confirmReset?'Tap again to erase all progress and mistakes':'Reset memory')+'</button>':'')+
    '</div>';
  $('#app').innerHTML=h;
  if($('#btnWeak'))$('#btnWeak').addEventListener('click',()=>newSet(true));
  $('#btnBack').addEventListener('click',back);
  if($('#btnReset'))$('#btnReset').addEventListener('click',()=>{
    if(!confirmReset){confirmReset=true;renderStats();return;}
    S=blank();save();confirmReset=false;renderStats();
  });
}

$('#btnNew').addEventListener('click',()=>newSet());
$('#btnStats').addEventListener('click',showStats);
newSet();      // every visit starts with a fresh random set
</script>
</body>
</html>
